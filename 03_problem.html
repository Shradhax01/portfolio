<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> TOURS AND TRAVELS </title>
    <style>
        :root {
            --accent: #1e90ff;
            --bg: #f7fbff;
            --card: #ffffff;
            --muted: #6b7280
        }

        * {
            box-sizing: border-box
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(180deg, #f0f4f8, #fff);
            margin: 0;
            padding: 40px;
            color: #111
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--accent)
        }

        form {
            max-width: 720px;
            margin: 0 auto;
            padding: 20px;
            background: var(--card);
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(20, 30, 40, 0.08)
        }

        form>div {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px
        }

        label {
            min-width: 140px;
            font-weight: 600;
            color: var(--muted)
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            flex: 1;
            min-width: 180px;
            padding: 8px 10px;
            border: 1px solid #d6dce4;
            border-radius: 6px
        }

        textarea {
            min-height: 80px;
            resize: vertical
        }

        input[type="checkbox"] {
            width: auto;
            margin: 0
        }

        button[type="submit"] {
            display: block;
            margin: 18px auto 0;
            padding: 10px 18px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px
        }

        button[type="submit"]:hover {
            background: #166fb3
        }

        @media (max-width:520px) {
            label {
                min-width: 120px
            }

            form {
                padding: 16px
            }
        }
    </style>
</head>

<body>
    
    <h1>Book a Vacation Trip</h1>
    <form action="/submit.php">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div>
            <label for="age">Age:</label>
            <input type="text" id="age" name="age" required>
        </di>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <label for="destination">Destination:</label>
        <select id="destination" name="destination" required>
            <option value="">Select Destination</option>
            <option value="paris">Paris</option>
            <option value="bali">Bali</option>
            <option value="newyork">New York</option>
            <option value="tokyo">Tokyo</option>
        </select>
            

           
            
           
       
        <div>
            <label for="dates">Travel Dates:</label>
            <input type="text" id="dates" name="dates" placeholder="DD/MM/YYYY - DD/MM/YYYY" required>

            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div>
            <label for="preferences">Preferences:</label>
            <textarea id="preferences" name="preferences"
                placeholder="Enter any special preferences or requirements"></textarea>
        </div>
        <div>
            <label for="terms">Terms and Conditions:</label>
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the terms and conditions</label>

        </div>
        </div>
        <button type="submit">Book Now</button>
        <div>
            <input type="hidden" name="userId" value="12345">
    </form>


</body>

</html>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.querySelector('form');
    const age = document.getElementById('age');
    const dates = document.getElementById('dates');
    const terms = document.getElementById('terms');

    const dateRe = /^\s*\d{2}\/\d{2}\/\d{4}\s*-\s*\d{2}\/\d{2}\/\d{4}\s*$/;

    if (age) {
        age.addEventListener('input', () => {
            age.value = age.value.replace(/[^\d]/g, '');
        });
    }

    if (form) {
        form.addEventListener('submit', (e) => {
            const errors = [];
            if (!age || !age.value || parseInt(age.value, 10) <= 0) errors.push('Please enter a valid age.');
            if (!dates || !dateRe.test(dates.value)) errors.push('Dates must be in DD/MM/YYYY - DD/MM/YYYY format.');
            if (!terms || !terms.checked) errors.push('You must agree to the terms and conditions.');
            if (errors.length) {
                e.preventDefault();
                alert(errors.join('\n'));
                return;
            }
            const name = (document.getElementById('name') || {}).value || 'Guest';
            const dest = (document.getElementById('destination') || {}).value || '—';
            const summary = `Confirm booking for ${name}\nDestination: ${dest}\nDates: ${dates ? dates.value : '—'}\nProceed?`;
            if (!confirm(summary)) e.preventDefault();
        });
    }
});
</script>
