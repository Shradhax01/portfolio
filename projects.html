<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY PROJECTS</title>
    <style>
        :root{--bg:#f6f8fb;--card:#fff;--accent:#0b79d0;--muted:#586069}
        html,body{height:100%}
        body{margin:0;font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;background:var(--bg);color:#222;display:flex;flex-direction:column;align-items:center;gap:20px;padding:32px}
        header{width:100%;max-width:900px;background:linear-gradient(90deg,#ffffffcc, #ffffffcc);padding:28px;border-radius:10px;box-shadow:0 6px 18px rgba(15,15,15,0.06);text-align:center}
        h1{margin:0 0 8px 0;color:var(--accent);font-size:1.8rem}
        header p{margin:0;color:var(--muted);line-height:1.5}
        main{width:100%;max-width:900px}
        #projects{display:flex;justify-content:center;padding:28px}
        #projects a{display:inline-block;padding:14px 20px;background:var(--accent);color:#fff;border-radius:8px;text-decoration:none;box-shadow:0 6px 16px rgba(11,121,208,0.18)}
        #projects a:hover{transform:translateY(-2px);transition:all 160ms ease}
        @media (max-width:520px){body{padding:18px}header{padding:18px}#projects{padding:16px}}
    </style>
</head>
<body>
    <header>
        <h1>My Projects</h1>
        <p>This is my first project on web development. I have created a simple form for booking a vacation trip. The form includes fields for the user's name, age, email, destination</p>

    <main>
        <section id="projects">
        <a href="03_problem.html" target="_blank">click here to view the project</a>
           </section>
    </main>
</body>
</html>
